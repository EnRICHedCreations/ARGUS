name: ARGUS Certification

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  certify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install
        run: npm install
      - name: TypeScript
        run: npm run typecheck
      - name: Deterministic tests
        run: npm test
      - name: Production build
        run: npm run build
